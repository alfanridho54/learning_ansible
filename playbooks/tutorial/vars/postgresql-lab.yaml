---
postgresql_version: "16"
postgresql_port: 5432
postgresql_listen_addresses: "*"
postgresql_max_connections: 100
postgresql_timezone: "{{ common_timezone | default('Asia/Jakarta') }}"
postgresql_allowed_networks:
  - network: "127.0.0.1/32"
    auth_method: "md5"
  - network: "0.0.0.0/0"
    auth_method: "md5"

postgresql_databases:
  - name: "cinema_pos"
    encoding: "UTF8"
    lc_collate: "en_US.UTF-8"
    lc_ctype: "en_US.UTF-8"

postgresql_user: "postgres"
postgresql_password: "{{ vault_postgres_password | default('cinema-lab-change-me') }}"
postgresql_host: "localhost"

postgresql_import:
  databases:
    - db_name: cinema_pos
      user: postgres
      password: "{{ vault_postgres_password | default('cinema-lab-change-me') }}"
      host: localhost
      sql_file_src: cinema_pos_lab.sql
      sql_file_dest: /tmp/cinema_pos_lab.sql
