---
# Deploy Cinema POS static (Vite) dari control node via Ansible.
# Build di laptop → copy dist/ ke outlet. Tidak ada download dari GitHub.

- name: Ensure Node.js present (encrypt helpers)
  ansible.builtin.apt:
    name:
      - nodejs
    state: present
    update_cache: true
  tags: [pos]

- name: Create cinema-pos directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ pos_web_root }}", owner: www-data, group: www-data, mode: "0755" }
    - { path: "{{ pos_opt_dir }}", owner: root, group: root, mode: "0750" }
  tags: [pos]

- name: Build Vite POS on control node
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -d node_modules ]; then npm install; fi
    npm run build
    test -f dist/index.html
  args:
    chdir: "{{ pos_local_app_path }}"
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  tags: [pos]

- name: Deploy Vite dist from control node to web root
  ansible.builtin.copy:
    src: "{{ pos_local_dist_path }}/"
    dest: "{{ pos_web_root }}/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"
  notify: Reload nginx
  tags: [pos]

- name: Install public outlet config.json
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ pos_web_root }}/{{ pos_config_filename }}"
    owner: www-data
    group: www-data
    mode: "0644"
  tags: [pos]

- name: Copy encrypt/decrypt helpers to /opt/cinema-pos
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ pos_opt_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - encrypt-config.js
    - decrypt-config.js
  tags: [pos]

- name: Generate encrypted config.enc (DATABASE_URL) outside web root
  ansible.builtin.command:
    argv:
      - "{{ pos_node_bin }}"
      - "{{ pos_opt_dir }}/encrypt-config.js"
      - "{{ pos_database_url }}"
      - "{{ pos_encryption_key }}"
      - "{{ pos_config_enc_path }}"
  args:
    chdir: "{{ pos_opt_dir }}"
  no_log: true
  tags: [pos, secrets]

- name: Restrict permissions on config.enc
  ansible.builtin.file:
    path: "{{ pos_config_enc_path }}"
    owner: root
    group: root
    mode: "0600"
  tags: [pos, secrets]
