---
# Simple: install pinned version → start → password → create DB.
# Version comes from playbooks/tutorial/vars/postgresql-lab.yaml (postgresql_version).

- name: "Install PostgreSQL {{ postgresql_version }}"
  apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
      - python3-psycopg2
    state: present
    update_cache: true

- name: Start PostgreSQL
  service:
    name: postgresql
    state: started
    enabled: true

- name: Set password for PostgreSQL user postgres
  shell: >
    sudo -u postgres psql -c
    "ALTER USER postgres WITH PASSWORD '{{ postgresql_password }}';"
  no_log: true
  changed_when: false

- name: Create application databases
  shell: |
    sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = '{{ item.name }}'" | grep -q 1 \
      || sudo -u postgres psql -c "CREATE DATABASE {{ item.name }} ENCODING '{{ item.encoding | default('UTF8') }}' TEMPLATE template0;"
  args:
    executable: /bin/bash
  loop: "{{ postgresql_databases }}"
  when: postgresql_databases | length > 0
  register: postgresql_db_create
  changed_when: "'CREATE DATABASE' in (postgresql_db_create.stdout | default(''))"
