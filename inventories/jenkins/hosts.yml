---
all:
  vars:
    ansible_user: ansible
    ansible_port: 22
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  children:
    outlets:
      hosts:
        outlet-jkt:
          ansible_host: cinema-outlet-jkt
          outlet_name: "Cinema Jakarta Pusat"
          outlet_code: "JKT"
          cinema_id: "JKT-LAB"
          cinema_name: "Jakarta Lab Outlet"
          device_hostname: "JKTLAB01"
          primary_ip: "127.0.0.1"
          backup_ip: "127.0.0.1"
        outlet-bdg:
          ansible_host: cinema-outlet-bdg
          outlet_name: "Cinema Bandung Braga"
          outlet_code: "BDG"
          cinema_id: "BDG-LAB"
          cinema_name: "Bandung Lab Outlet"
          device_hostname: "BDGLAB01"
          primary_ip: "127.0.0.1"
          backup_ip: "127.0.0.1"
        outlet-sby:
          ansible_host: cinema-outlet-sby
          outlet_name: "Cinema Surabaya Tunjungan"
          outlet_code: "SBY"
          cinema_id: "SBY-LAB"
          cinema_name: "Surabaya Lab Outlet"
          device_hostname: "SBYLAB01"
          primary_ip: "127.0.0.1"
          backup_ip: "127.0.0.1"